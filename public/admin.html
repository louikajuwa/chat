<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <style>
    html, body { height: 100%; height: 100dvh; }
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid #1a1a1a; outline-offset: 2px; }
    .drawer { transform: translateX(-100%); transition: transform .25s ease; }
    .drawer.open { transform: translateX(0); }
    @media (min-width: 768px) { .drawer { transform: none !important; position: static !important; } }
    .scroll-y { scrollbar-width: thin; scrollbar-color: #d6d3cb transparent; }
    .scroll-y::-webkit-scrollbar { width: 6px; }
    .scroll-y::-webkit-scrollbar-thumb { background: #d6d3cb; border-radius: 3px; }
    textarea { resize: none; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body class="bg-paper text-ink antialiased flex flex-col">
  <div id="conn-banner" role="status" class="flex-shrink-0"></div>

  <!-- Mobile top bar -->
  <header id="topbar" class="md:hidden flex items-center justify-between px-4 h-14 border-b border-line bg-white flex-shrink-0">
    <button id="drawer-toggle" type="button" class="w-10 h-10 -ml-2 flex items-center justify-center rounded-lg"
            aria-label="Open conversations" aria-expanded="false" aria-controls="drawer">
      <svg class="w-5 h-5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <div class="font-semibold tracking-tight">Admin</div>
    <a href="/" class="min-h-[40px] px-2 -mr-2 flex items-center text-sm text-muted hover:text-ink rounded-lg">Exit</a>
  </header>

  <div class="flex-1 flex overflow-hidden relative">
    <!-- Drawer overlay (mobile) -->
    <div id="drawer-overlay" class="fixed inset-0 bg-black/30 hidden md:hidden z-30" aria-hidden="true"></div>

    <!-- Sidebar -->
    <aside id="drawer" aria-label="Conversations"
           class="drawer fixed md:static inset-y-0 left-0 w-[88%] max-w-sm md:w-80 md:flex-shrink-0 bg-white border-r border-line z-40 flex flex-col">
      <div class="px-5 py-4 border-b border-line flex items-center justify-between gap-2">
        <div class="min-w-0">
          <div class="text-[11px] uppercase tracking-[0.2em] text-muted mb-1">Conversations</div>
          <h2 class="text-lg font-bold tracking-tight">Inbox</h2>
        </div>
        <div class="flex items-center gap-1 flex-shrink-0">
          <a href="/" class="hidden md:flex min-h-[40px] px-2 items-center text-sm text-muted hover:text-ink rounded-lg">Exit</a>
          <form id="logout-form" method="post" action="/admin/logout" class="flex">
            <button type="submit" class="min-h-[40px] px-2 text-sm text-muted hover:text-ink rounded-lg">Log out</button>
          </form>
          <button class="md:hidden w-10 h-10 -mr-2 flex items-center justify-center text-muted hover:text-ink rounded-lg" aria-label="Close conversations" id="drawer-close" type="button">
            <svg class="w-5 h-5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
      <div id="room-list-container" class="flex-1 overflow-y-auto scroll-y px-3 py-3">
        <div id="room-list"></div>
        <div id="rooms-empty" class="hidden text-center text-sm text-muted py-12 px-4">
          <div class="w-12 h-12 mx-auto rounded-full bg-paper border border-line flex items-center justify-center mb-3">
            <svg class="w-5 h-5 text-muted" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12a9 9 0 11-3.73-7.31L21 4l-1 4.27A8.96 8.96 0 0121 12z" />
            </svg>
          </div>
          No conversations yet. Guests will appear here.
        </div>
        <div id="rooms-loading" class="hidden text-center text-xs text-muted py-3">Loading…</div>
      </div>
    </aside>

    <!-- Chat panel -->
    <main id="main" class="flex-1 flex flex-col bg-white min-w-0">
      <div id="chat-empty" class="flex-1 flex items-center justify-center text-center p-8">
        <div>
          <div class="w-14 h-14 mx-auto rounded-full bg-paper border border-line flex items-center justify-center mb-4">
            <svg class="w-6 h-6 text-muted" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.76c0 1.6 1.123 2.994 2.707 3.227 1.068.157 2.148.279 3.238.364.466.037.893.281 1.153.671L12 21l2.652-3.978c.26-.39.687-.634 1.153-.67 1.09-.086 2.17-.208 3.238-.365 1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" />
            </svg>
          </div>
          <h1 class="text-base font-semibold mb-1">Select a conversation</h1>
          <p class="text-sm text-muted">Pick a room from the list to start replying.</p>
        </div>
      </div>

      <div id="chat-view" class="hidden flex-1 flex flex-col min-h-0">
        <div class="px-4 sm:px-6 min-h-[56px] py-1 flex items-center gap-2 border-b border-line flex-shrink-0">
          <button id="back-to-rooms" type="button" class="md:hidden w-10 h-10 -ml-2 flex items-center justify-center text-muted hover:text-ink rounded-lg flex-shrink-0"
                  aria-label="Back to conversations" aria-controls="drawer">
            <svg class="w-5 h-5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <div class="min-w-0">
            <h1 class="font-semibold truncate" id="chat-title">Guest</h1>
            <div class="text-[11px] text-muted truncate" id="chat-subtitle"></div>
          </div>
        </div>

        <div id="messages-container" class="flex-1 overflow-y-auto scroll-y px-4 sm:px-6 py-4 min-h-0">
          <div id="messages-loading" class="hidden text-center text-xs text-muted py-3">Loading older messages…</div>
          <div id="messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation"></div>
          <div id="messages-status" class="text-center text-sm text-muted py-12">Loading conversation…</div>
        </div>

        <form id="chat-form" class="border-t border-line p-3 sm:p-4 flex-shrink-0 bg-white">
          <div id="file-chip" class="hidden mb-2 inline-flex items-center gap-1 max-w-full min-h-[40px] bg-paper border border-line rounded-full pl-3 pr-1 text-sm">
            <svg class="w-4 h-4 text-muted flex-shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-3a2.25 2.25 0 00-2.25 2.25V9m7.5 0H8.25m7.5 0v.375c0 .621-.504 1.125-1.125 1.125h-5.25A1.125 1.125 0 018.25 9.375V9m7.5 0L18 11.25v9.375A1.125 1.125 0 0116.875 21.75h-9.75A1.125 1.125 0 016 20.625v-9.375L8.25 9" />
            </svg>
            <span id="file-chip-name" class="truncate min-w-0"></span>
            <button type="button" id="file-chip-remove" class="w-10 h-10 rounded-full hover:bg-line flex-shrink-0 flex items-center justify-center text-muted hover:text-ink" aria-label="Remove attached file">
              <span aria-hidden="true" class="text-lg leading-none">×</span>
            </button>
          </div>
          <div id="char-count" class="hidden text-right text-[11px] text-muted mb-1"></div>
          <div class="flex items-end gap-2">
            <input id="file-input" type="file" class="peer sr-only"
                   accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.txt,.zip,.doc,.docx,.xls,.xlsx,image/png,image/jpeg,image/gif,image/webp,application/pdf,text/plain,application/zip,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
            <label for="file-input"
                   class="cursor-pointer w-10 h-10 flex items-center justify-center flex-shrink-0 text-muted hover:text-ink rounded-lg peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-ink">
              <svg class="w-5 h-5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32m.009-.01l-.01.01m5.699-9.941l-7.81 7.81a1.5 1.5 0 002.112 2.13" />
              </svg>
              <span class="sr-only">Attach file (max 5 MB)</span>
            </label>
            <label for="message-input" class="sr-only">Reply</label>
            <textarea id="message-input" rows="1" maxlength="5000"
                      class="flex-1 min-w-0 min-h-[40px] px-4 py-2 bg-paper border border-line rounded-2xl text-base sm:text-sm focus:border-ink transition-colors max-h-32"
                      placeholder="Write a reply…"></textarea>
            <button id="send-btn" type="submit"
                    class="w-10 h-10 flex items-center justify-center bg-ink text-white rounded-full disabled:opacity-30 disabled:cursor-not-allowed hover:bg-black transition-colors flex-shrink-0"
                    aria-label="Send" disabled>
              <svg class="w-5 h-5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
              </svg>
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/js/common.js" defer></script>
  <script src="/js/admin.js" defer></script>
</body>
</html>
