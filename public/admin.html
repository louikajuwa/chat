<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
          colors: {
            ink: '#1a1a1a', paper: '#f7f6f3', line: '#e7e5e0',
            muted: '#6b6b6b', accent: '#ff5a36',
          },
        },
      },
    };
  </script>
  <style>
    html, body { height: 100%; height: 100dvh; }
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    /* Mobile drawer */
    .drawer { transform: translateX(-100%); transition: transform .25s ease; }
    .drawer.open { transform: translateX(0); }
    @media (min-width: 768px) { .drawer { transform: none !important; position: static !important; } }
    /* Scrollbars */
    .scroll-y { scrollbar-width: thin; scrollbar-color: #d6d3cb transparent; }
    .scroll-y::-webkit-scrollbar { width: 6px; }
    .scroll-y::-webkit-scrollbar-thumb { background: #d6d3cb; border-radius: 3px; }
    /* Bubble image */
    .bubble img { max-height: 240px; max-width: 100%; border-radius: 12px; display: block; }
    .bubble a { word-break: break-all; }
    /* Auto-grow textarea */
    textarea { resize: none; }
  </style>
</head>
<body class="bg-paper text-ink antialiased flex flex-col">
  <!-- Mobile top bar -->
  <header class="md:hidden flex items-center justify-between px-4 h-14 border-b border-line bg-white flex-shrink-0">
    <button id="drawer-toggle" class="p-2 -ml-2" aria-label="Open rooms">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <div class="font-semibold tracking-tight">Admin</div>
    <a href="/" class="text-xs text-muted">Exit</a>
  </header>

  <div class="flex-1 flex overflow-hidden relative">
    <!-- Drawer overlay (mobile) -->
    <div id="drawer-overlay" class="fixed inset-0 bg-black/30 hidden md:hidden z-30"></div>

    <!-- Sidebar -->
    <aside id="drawer" class="drawer fixed md:static inset-y-0 left-0 w-[88%] max-w-sm md:w-80 md:flex-shrink-0 bg-white border-r border-line z-40 flex flex-col">
      <!-- Sidebar header -->
      <div class="px-5 py-5 border-b border-line flex items-center justify-between">
        <div>
          <div class="text-[10px] uppercase tracking-[0.2em] text-muted mb-1">Conversations</div>
          <div class="text-lg font-bold tracking-tight">Inbox</div>
        </div>
        <a href="/" class="hidden md:block text-xs text-muted hover:text-ink">Exit</a>
        <button class="md:hidden p-2 -mr-2 text-muted" aria-label="Close" id="drawer-close">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <!-- Room list -->
      <div id="room-list-container" class="flex-1 overflow-y-auto scroll-y px-3 py-3">
        <div id="room-list"></div>
        <div id="rooms-empty" class="hidden text-center text-sm text-muted py-12 px-4">
          <div class="w-12 h-12 mx-auto rounded-full bg-paper border border-line flex items-center justify-center mb-3">
            <svg class="w-5 h-5 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12a9 9 0 11-3.73-7.31L21 4l-1 4.27A8.96 8.96 0 0121 12z" />
            </svg>
          </div>
          No conversations yet. Guests will appear here.
        </div>
        <div id="rooms-loading" class="hidden text-center text-xs text-muted py-3">Loading…</div>
      </div>
    </aside>

    <!-- Chat panel -->
    <main class="flex-1 flex flex-col bg-white min-w-0">
      <!-- Empty state -->
      <div id="chat-empty" class="flex-1 flex items-center justify-center text-center p-8">
        <div>
          <div class="w-14 h-14 mx-auto rounded-full bg-paper border border-line flex items-center justify-center mb-4">
            <svg class="w-6 h-6 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.76c0 1.6 1.123 2.994 2.707 3.227 1.068.157 2.148.279 3.238.364.466.037.893.281 1.153.671L12 21l2.652-3.978c.26-.39.687-.634 1.153-.67 1.09-.086 2.17-.208 3.238-.365 1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" />
            </svg>
          </div>
          <div class="text-base font-semibold mb-1">Select a conversation</div>
          <div class="text-sm text-muted">Pick a room from the list to start replying.</div>
        </div>
      </div>

      <!-- Active chat view -->
      <div id="chat-view" class="hidden flex-1 flex flex-col min-h-0">
        <!-- Chat header -->
        <div class="px-4 sm:px-6 h-14 flex items-center gap-3 border-b border-line flex-shrink-0">
          <button id="back-to-rooms" class="md:hidden p-1.5 -ml-1.5 text-muted" aria-label="Back to rooms">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <div class="min-w-0">
            <div class="font-semibold truncate" id="chat-title">Guest</div>
            <div class="text-[11px] text-muted truncate" id="chat-subtitle"></div>
          </div>
        </div>

        <!-- Messages -->
        <div id="messages-container" class="flex-1 overflow-y-auto scroll-y px-4 sm:px-6 py-4 min-h-0">
          <div id="messages-loading" class="hidden text-center text-xs text-muted py-3">Loading older messages…</div>
          <div id="messages"></div>
        </div>

        <!-- Composer -->
        <form id="chat-form" class="border-t border-line p-3 sm:p-4 flex-shrink-0 bg-white">
          <div id="file-chip" class="hidden mb-2 inline-flex items-center gap-2 max-w-full bg-paper border border-line rounded-full pl-3 pr-2 py-1 text-xs">
            <svg class="w-3.5 h-3.5 text-muted flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-3a2.25 2.25 0 00-2.25 2.25V9m7.5 0H8.25m7.5 0v.375c0 .621-.504 1.125-1.125 1.125h-5.25A1.125 1.125 0 018.25 9.375V9m7.5 0L18 11.25v9.375A1.125 1.125 0 0116.875 21.75h-9.75A1.125 1.125 0 016 20.625v-9.375L8.25 9" />
            </svg>
            <span id="file-chip-name" class="truncate"></span>
            <button type="button" id="file-chip-remove" class="w-5 h-5 rounded-full hover:bg-line flex-shrink-0 flex items-center justify-center text-muted" aria-label="Remove file">×</button>
          </div>
          <div class="flex items-end gap-2">
            <label for="file-input" class="cursor-pointer p-2.5 text-muted hover:text-ink rounded-lg" aria-label="Attach file">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32m.009-.01l-.01.01m5.699-9.941l-7.81 7.81a1.5 1.5 0 002.112 2.13" />
              </svg>
            </label>
            <input id="file-input" type="file" class="hidden" />
            <textarea id="message-input" rows="1"
                      class="flex-1 px-4 py-2.5 bg-paper border border-line rounded-2xl text-sm focus:outline-none focus:border-ink transition-colors max-h-32"
                      placeholder="Write a reply…"></textarea>
            <button id="send-btn" type="submit"
                    class="p-2.5 bg-ink text-white rounded-full disabled:opacity-30 disabled:cursor-not-allowed hover:bg-black transition-colors flex-shrink-0"
                    aria-label="Send" disabled>
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
              </svg>
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-ink text-white text-sm px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity z-50"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ---------- State ----------
    const socket = io();
    const state = {
      rooms: new Map(),          // room -> meta
      currentRoom: null,
      messageIds: new Set(),
      oldestMessageId: null,     // smallest id currently rendered
      hasMoreMessages: false,
      hasMoreRooms: false,
      loadingMoreRooms: false,
      loadingMoreMessages: false,
    };

    // ---------- Element refs ----------
    const $ = (id) => document.getElementById(id);
    const drawer = $('drawer');
    const drawerOverlay = $('drawer-overlay');
    const drawerToggle = $('drawer-toggle');
    const drawerClose = $('drawer-close');
    const backToRooms = $('back-to-rooms');
    const roomListEl = $('room-list');
    const roomListContainer = $('room-list-container');
    const roomsEmpty = $('rooms-empty');
    const roomsLoading = $('rooms-loading');
    const chatEmpty = $('chat-empty');
    const chatView = $('chat-view');
    const chatTitle = $('chat-title');
    const chatSubtitle = $('chat-subtitle');
    const messagesEl = $('messages');
    const messagesContainer = $('messages-container');
    const messagesLoading = $('messages-loading');
    const form = $('chat-form');
    const messageInput = $('message-input');
    const fileInput = $('file-input');
    const fileChip = $('file-chip');
    const fileChipName = $('file-chip-name');
    const fileChipRemove = $('file-chip-remove');
    const sendBtn = $('send-btn');
    const toast = $('toast');

    // ---------- Utilities ----------
    const escapeHtml = (s) =>
      String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    const isImage = (p) => /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(p || '');
    const fileNameFromPath = (p) =>
      String(p || '').split('/').pop().replace(/^[a-f0-9]{16}-|^\d{10,}-/, '');

    function fmtTime(d) {
      const date = new Date(d);
      if (Number.isNaN(date.getTime())) return '';
      const now = new Date();
      const sameDay = date.toDateString() === now.toDateString();
      return sameDay
        ? date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        : date.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.opacity = '1';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => (toast.style.opacity = '0'), 2500);
    }

    // ---------- Drawer ----------
    function openDrawer() {
      drawer.classList.add('open');
      drawerOverlay.classList.remove('hidden');
    }
    function closeDrawer() {
      drawer.classList.remove('open');
      drawerOverlay.classList.add('hidden');
    }
    drawerToggle.addEventListener('click', openDrawer);
    drawerClose.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);
    backToRooms.addEventListener('click', openDrawer);

    // ---------- Room cards ----------
    function buildOrUpdateRoomCard(meta) {
      let card = roomListEl.querySelector(`[data-room="${CSS.escape(meta.room)}"]`);
      const isNew = !card;
      if (isNew) {
        card = document.createElement('button');
        card.dataset.room = meta.room;
        card.type = 'button';
        card.addEventListener('click', () => {
          if (state.currentRoom !== meta.room) selectRoom(meta.room);
          closeDrawer();
        });
      }
      state.rooms.set(meta.room, meta);

      const isActive = state.currentRoom === meta.room;
      const unread = meta.has_unread && !isActive;
      const preview = meta.last_attachment
        ? 'Attachment'
        : (meta.last_message || 'No messages yet');

      card.className =
        'block w-full text-left p-3 rounded-xl border mb-2 transition-colors ' +
        (isActive
          ? 'border-ink bg-paper'
          : 'border-line bg-white hover:border-ink/40');

      card.innerHTML = `
        <div class="flex items-start justify-between gap-2 mb-0.5">
          <div class="font-semibold text-sm truncate flex-1">${escapeHtml(meta.sender_name || 'Guest')}</div>
          ${unread ? '<span class="w-2 h-2 rounded-full bg-accent flex-shrink-0 mt-1.5"></span>' : ''}
        </div>
        <div class="text-xs ${unread ? 'text-ink font-medium' : 'text-muted'} truncate">${escapeHtml(preview)}</div>
        <div class="text-[10px] text-muted/70 mt-1 truncate">${escapeHtml(meta.room)}</div>
      `;
      return { card, isNew };
    }

    function setRoomList(rooms, hasMore) {
      state.rooms.clear();
      roomListEl.innerHTML = '';
      for (const meta of rooms) {
        const { card } = buildOrUpdateRoomCard(meta);
        roomListEl.appendChild(card);
      }
      state.hasMoreRooms = hasMore;
      toggleRoomsEmpty();
    }

    function appendRoomList(rooms, hasMore) {
      for (const meta of rooms) {
        if (state.rooms.has(meta.room)) continue;
        const { card } = buildOrUpdateRoomCard(meta);
        roomListEl.appendChild(card);
      }
      state.hasMoreRooms = hasMore;
      toggleRoomsEmpty();
    }

    function upsertRoomToTop(meta) {
      const { card, isNew } = buildOrUpdateRoomCard(meta);
      if (!isNew && card.parentNode === roomListEl) {
        roomListEl.removeChild(card);
      }
      roomListEl.prepend(card);
      toggleRoomsEmpty();
    }

    function toggleRoomsEmpty() {
      roomsEmpty.classList.toggle('hidden', state.rooms.size > 0);
    }

    // ---------- Messages ----------
    function buildAttachmentNode(path) {
      const safe = escapeHtml(path);
      if (isImage(path)) {
        return `<a href="${safe}" target="_blank" rel="noopener" class="block mt-1.5"><img src="${safe}" alt="attachment"/></a>`;
      }
      return `<a href="${safe}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 mt-1.5 text-xs underline opacity-90">
        <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32" />
        </svg>
        <span class="truncate">${escapeHtml(fileNameFromPath(path))}</span>
      </a>`;
    }

    function buildMessageNode(msg) {
      if (state.messageIds.has(msg.id)) return null;
      state.messageIds.add(msg.id);
      state.oldestMessageId =
        state.oldestMessageId == null ? msg.id : Math.min(state.oldestMessageId, msg.id);

      const isMine = msg.sender_name === 'Admin';
      const wrap = document.createElement('div');
      wrap.dataset.id = msg.id;
      wrap.className = 'flex flex-col mb-3 ' + (isMine ? 'items-end' : 'items-start');

      const bubble = document.createElement('div');
      bubble.className =
        'bubble max-w-[85%] sm:max-w-[70%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed ' +
        (isMine ? 'bg-ink text-white' : 'bg-paper border border-line text-ink');

      let html = '';
      if (msg.message) {
        html += `<div class="whitespace-pre-wrap break-words">${escapeHtml(msg.message)}</div>`;
      }
      if (msg.attachment_path) html += buildAttachmentNode(msg.attachment_path);
      bubble.innerHTML = html;

      const meta = document.createElement('div');
      meta.className = 'text-[10px] text-muted mt-1 px-1';
      meta.textContent =
        (isMine ? 'You' : escapeHtml(msg.sender_name || 'Guest')) + ' · ' + fmtTime(msg.created_at);

      wrap.appendChild(bubble);
      wrap.appendChild(meta);
      return wrap;
    }

    function appendMessage(msg) {
      const nearBottom = isNearBottom();
      const node = buildMessageNode(msg);
      if (!node) return;
      messagesEl.appendChild(node);
      if (nearBottom) scrollToBottom();
    }

    function prependMessages(msgs) {
      const prevHeight = messagesContainer.scrollHeight;
      const prevTop = messagesContainer.scrollTop;
      const frag = document.createDocumentFragment();
      // msgs are oldest-first; we want oldest at top, so iterate in reverse for prepend.
      for (let i = msgs.length - 1; i >= 0; i--) {
        const node = buildMessageNode(msgs[i]);
        if (node) frag.prepend(node);
      }
      messagesEl.prepend(frag);
      messagesContainer.scrollTop = messagesContainer.scrollHeight - prevHeight + prevTop;
    }

    function setMessages(msgs) {
      messagesEl.innerHTML = '';
      state.messageIds.clear();
      state.oldestMessageId = null;
      for (const msg of msgs) {
        const node = buildMessageNode(msg);
        if (node) messagesEl.appendChild(node);
      }
      requestAnimationFrame(scrollToBottom);
    }

    function isNearBottom() {
      const c = messagesContainer;
      return c.scrollHeight - c.scrollTop - c.clientHeight < 100;
    }
    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // ---------- Room selection ----------
    function selectRoom(room) {
      state.currentRoom = room;
      state.messageIds.clear();
      state.oldestMessageId = null;
      state.hasMoreMessages = false;
      state.loadingMoreMessages = false;
      messagesEl.innerHTML = '';
      const meta = state.rooms.get(room);
      chatTitle.textContent = meta?.sender_name || 'Guest';
      chatSubtitle.textContent = room;
      chatEmpty.classList.add('hidden');
      chatView.classList.remove('hidden');
      // Refresh card classes so the active one is visually highlighted.
      for (const m of state.rooms.values()) buildOrUpdateRoomCard(m);
      socket.emit('adminSelectRoom', { room });
    }

    // ---------- Composer state ----------
    function updateSendButton() {
      const hasText = messageInput.value.trim().length > 0;
      const hasFile = !!fileInput.files[0];
      sendBtn.disabled = !(hasText || hasFile);
    }
    function autoGrow() {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 128) + 'px';
    }
    messageInput.addEventListener('input', () => { updateSendButton(); autoGrow(); });
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
    fileInput.addEventListener('change', () => {
      const f = fileInput.files[0];
      if (f) {
        fileChipName.textContent = f.name;
        fileChip.classList.remove('hidden');
      } else {
        fileChip.classList.add('hidden');
      }
      updateSendButton();
    });
    fileChipRemove.addEventListener('click', () => {
      fileInput.value = '';
      fileChip.classList.add('hidden');
      updateSendButton();
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!state.currentRoom) return;
      const text = messageInput.value.trim();
      const file = fileInput.files[0];
      if (!text && !file) return;

      const send = (filePayload) => {
        const payload = { room: state.currentRoom };
        if (text) payload.message = text;
        if (filePayload) payload.file = filePayload;
        socket.emit('adminMessage', payload);
        messageInput.value = '';
        fileInput.value = '';
        fileChip.classList.add('hidden');
        autoGrow();
        updateSendButton();
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) =>
          send({ name: file.name, type: file.type, data: ev.target.result });
        reader.onerror = () => showToast('Could not read file');
        reader.readAsDataURL(file);
      } else {
        send(null);
      }
    });

    // ---------- Scroll-based pagination ----------
    messagesContainer.addEventListener('scroll', () => {
      if (
        messagesContainer.scrollTop < 80 &&
        state.hasMoreMessages &&
        !state.loadingMoreMessages &&
        state.oldestMessageId
      ) {
        state.loadingMoreMessages = true;
        messagesLoading.classList.remove('hidden');
        socket.emit('adminLoadMoreMessages', {
          room: state.currentRoom,
          beforeId: state.oldestMessageId,
        });
      }
    });

    roomListContainer.addEventListener('scroll', () => {
      const c = roomListContainer;
      const nearBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 80;
      if (nearBottom && state.hasMoreRooms && !state.loadingMoreRooms && state.rooms.size > 0) {
        state.loadingMoreRooms = true;
        roomsLoading.classList.remove('hidden');
        // Smallest id currently in the list is the cursor.
        let minId = Infinity;
        for (const m of state.rooms.values()) if (m.id < minId) minId = m.id;
        socket.emit('adminLoadMoreRooms', { beforeId: minId });
      }
    });

    // ---------- Socket events ----------
    socket.on('connect', () => {
      socket.emit('adminConnected');
      if (state.currentRoom) socket.emit('adminSelectRoom', { room: state.currentRoom });
    });

    socket.on('roomList', ({ rooms, hasMore }) => {
      setRoomList(rooms, hasMore);
    });

    socket.on('roomListAppend', ({ rooms, hasMore }) => {
      appendRoomList(rooms, hasMore);
      state.loadingMoreRooms = false;
      roomsLoading.classList.add('hidden');
    });

    socket.on('roomNew', (meta) => {
      upsertRoomToTop(meta);
    });

    socket.on('roomUpdate', (meta) => {
      // Move to top to reflect recent activity, unless it's the active room
      // (active room shouldn't reorder under the user's cursor).
      if (state.currentRoom === meta.room) {
        // Just update content/classes in place.
        buildOrUpdateRoomCard(meta);
      } else {
        upsertRoomToTop(meta);
      }
    });

    socket.on('chatHistory', ({ room, messages, hasMore }) => {
      if (room !== state.currentRoom) return; // user switched rooms mid-flight
      state.hasMoreMessages = hasMore;
      setMessages(messages);
    });

    socket.on('chatHistoryAppend', ({ room, messages, hasMore }) => {
      if (room !== state.currentRoom) return;
      state.hasMoreMessages = hasMore;
      state.loadingMoreMessages = false;
      messagesLoading.classList.add('hidden');
      prependMessages(messages);
    });

    socket.on('message', (msg) => {
      if (!state.currentRoom || msg.room !== state.currentRoom) return;
      appendMessage(msg);
    });

    socket.on('serverError', ({ message }) => showToast(message || 'Something went wrong'));
    socket.on('connect_error', () => showToast('Connection lost. Reconnecting…'));
  </script>
